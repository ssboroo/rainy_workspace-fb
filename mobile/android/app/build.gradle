plugins { id 'com.android.application' }

android {
    namespace 'studio.rainy.fbpro'
    compileSdk 36

    defaultConfig {
        applicationId 'studio.rainy.fbpro'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-stable:161.0.20261103075946'
}
