plugins { id 'com.android.application' }

android {
    namespace 'studio.rainy.fbpro'
    compileSdk 37

    defaultConfig {
        applicationId 'studio.rainy.fbpro'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
}

def mobileExtension = layout.buildDirectory.dir('generated/mobile-extension-assets')
def prepareMobileExtension = tasks.register('prepareMobileExtension', Sync) {
    from('../../ios/SafariExtension')
    from('../../../extension/content-facebook.js')
    into(mobileExtension.map { it.dir('rainy') })
}

android.sourceSets.main.assets.srcDir(mobileExtension)
tasks.named('preBuild').configure { dependsOn(prepareMobileExtension) }