name: RAINY FB Pro — Web Store package

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run extension tests
        run: node --test tests/*.cjs
      - name: Install Python test dependency
        run: python -m pip install lxml
      - name: Run Python tests
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build clean Chrome Web Store directory
        run: node scripts/build-webstore.mjs dist/rainy-fb-pro-webstore
      - name: Validate JavaScript syntax
        run: find dist/rainy-fb-pro-webstore -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create upload ZIP with manifest at root
        run: |
          cd dist/rainy-fb-pro-webstore
          zip -qr ../rainy-fb-pro-5.6.8-webstore.zip .
      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: rainy-fb-pro-5.6.8-webstore
          path: dist/rainy-fb-pro-5.6.8-webstore.zip
          if-no-files-found: error
          retention-days: 30
