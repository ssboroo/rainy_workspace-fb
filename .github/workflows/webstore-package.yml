name: RAINY FB Pro — Web Store package

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run extension tests
        run: node --test tests/*.cjs
      - name: Install Python test dependency
        run: python -m pip install lxml
      - name: Run Python tests
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build clean Chrome Web Store directory
        run: node scripts/build-webstore.mjs dist/rainy-fb-pro-webstore
      - name: Validate JavaScript syntax
        run: find dist/rainy-fb-pro-webstore -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create upload ZIP with manifest at root
        run: |
          cd dist/rainy-fb-pro-webstore
          zip -qr ../rainy-fb-pro-5.8.0-webstore.zip .
      - name: Publish public 5.8.0 download on main
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/downloads
          cp dist/rainy-fb-pro-5.8.0-webstore.zip public/downloads/rainy-fb-pro-5.8.0.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/rainy-fb-pro-5.8.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish 5.8.0 Chrome extension package [skip ci]"
            git push
          fi
      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: rainy-fb-pro-5.8.0-webstore
          path: dist/rainy-fb-pro-5.8.0-webstore.zip
          if-no-files-found: error
          retention-days: 30
