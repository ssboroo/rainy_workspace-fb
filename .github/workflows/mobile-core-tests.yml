name: Mobile shared-core tests
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile_shared_core_test.cjs'
      - '.github/workflows/mobile-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tests/mobile_shared_core_test.cjs'
      - '.github/workflows/mobile-core-tests.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/mobile_shared_core_test.cjs
